services:
  postgres:
    image: postgres:15-alpine
    container_name: dle_db
    environment:
      POSTGRES_DB: dle_database
      POSTGRES_USER: dle_user
      POSTGRES_PASSWORD: dle_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: dle_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: