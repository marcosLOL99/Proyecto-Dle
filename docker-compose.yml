version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: dle_db
    environment:
      POSTGRES_DB: dle_database
      POSTGRES_USER: dle_user
      POSTGRES_PASSWORD: dle_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: